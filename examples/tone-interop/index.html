<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tone.js interop</title>
    <style>
      :root {
        color-scheme: light dark;
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      body {
        max-width: 420px;
        margin: 10vh auto;
        padding: 0 16px;
      }
    </style>
  </head>
  <body>
    <h1>Tone.js interop</h1>
    <p>A looping SamplePlayer, sequenced by Tone's Transport and played through a Tone reverb.</p>
    <button id="toggle" disabled>Loading…</button>

    <script type="module">
      import * as Tone from 'https://esm.sh/tone@15.1.22';
      import { createSamplePlayer, setGlobalAudioContext } from '../../src/index.ts';

      // One shared context, set on both sides before either creates nodes.
      // Tone.Transport and Tone.Destination are bound to Tone's import-time context,
      // so use getTransport() and getDestination() after setContext.
      const ctx = new AudioContext();
      Tone.setContext(ctx);
      setGlobalAudioContext(ctx);

      // A decaying sawtooth at C4 (MIDI 60), so the example needs no sample file.
      const seconds = 2;
      const buffer = ctx.createBuffer(1, ctx.sampleRate * seconds, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) {
        const t = i / ctx.sampleRate;
        data[i] = 0.5 * (((t * 261.63) % 1) * 2 - 1) * Math.exp(-t);
      }

      const player = await createSamplePlayer({ audio: buffer });
      player.setLoopEnabled(true);
      player.setLoopPoints(0.5, 0.6);

      // Tone effects' inputs are Tone nodes, so wire with Tone.connect, which unwraps them.
      const reverb = new Tone.Reverb(3).connect(Tone.getDestination());
      player.disconnect();
      Tone.connect(player.output, reverb);

      const chords = [
        [60, 64, 67],
        [57, 60, 64],
        [53, 57, 60],
        [55, 59, 62],
      ];
      let step = 0;
      new Tone.Loop((time) => {
        // play() and release() take seconds from now, not absolute times
        const delay = time - ctx.currentTime;
        for (const note of chords[step % chords.length]) {
          player.play(note, 90, undefined, delay);
          player.release(note, delay + 1.2);
        }
        step++;
      }, '1m').start(0);

      const transport = Tone.getTransport();
      transport.bpm.value = 100;
      const button = document.getElementById('toggle');
      button.textContent = 'Start';
      button.disabled = false;
      button.onclick = async () => {
        await Tone.start();
        if (transport.state === 'started') {
          transport.stop();
          player.releaseAll();
          button.textContent = 'Start';
        } else {
          transport.start();
          button.textContent = 'Stop';
        }
      };
    </script>
  </body>
</html>
