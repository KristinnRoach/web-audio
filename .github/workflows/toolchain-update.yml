name: Update toolchain

# Weekly PR that moves pnpm and Vite+ to their latest versions.
on:
  schedule:
    - cron: '30 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version: latest
          run-install: false
      - name: Update Vite+
        if: hashFiles('vite.config.*') != ''
        run: vp migrate --no-interactive --no-agent --no-editor --no-hooks
      - name: Update pnpm
        run: vp env pin pnpm@latest --force --no-install && vp install
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: maintenance/toolchain
          title: Update pnpm and Vite+
          commit-message: Update pnpm and Vite+
          body: Weekly `vp migrate` and `vp env pin pnpm@latest`. Merge if checks pass.
